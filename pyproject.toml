[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jamboy"
version = "0.1.0"
description = "GPS-denied drone navigation layer (optical flow + map match + EKF). Sim-validated, not flight-certified."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fratres-X AI" }]
keywords = ["drone", "navigation", "gps-denied", "optical-flow", "ekf", "mavlink"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pymavlink>=2.4.40",
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",
    "pyyaml>=6.0",
    "filterpy>=1.4.5",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0.0",
    "torch>=2.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/Fratres-X-AI/JamBoy"
Repository = "https://github.com/Fratres-X-AI/JamBoy"
Issues = "https://github.com/Fratres-X-AI/JamBoy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: requires CUDA device",
    "slow: long-running stress tests",
]
